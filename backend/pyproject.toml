[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-tutor"
version = "0.1.0"
description = "AI Learning Tutoring Platform — Scope A"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "greenlet>=3.1.0",
  "httpx>=0.27.0",
  "arq>=0.26.0",
  "redis>=5.2.0",
  "PyJWT>=2.10.0",
  "bcrypt>=4.2.0",
  "python-multipart>=0.0.17",
  "minio>=7.2.0",
  "pypdf>=5.1.0",
  "Pillow>=11.0.0",
  "numpy>=2.1.0",
  "pgvector>=0.3.6",
  "PyYAML>=6.0.2",
  "llama-index-core>=0.12.0",
  "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
# Offline OCR for images / scanned PDFs. Kept optional on purpose: the engine
# publishes no wheel for Python 3.13+, and OCR_PROVIDER=auto already degrades
# to a vision model when the engine is absent -- so a 3.13 install must not die
# on this one package. Python 3.11/3.12 users get it from "backend[dev,ocr]".
ocr = [
  "rapidocr-onnxruntime>=1.4.4; python_version < '3.13'",
]
stt = [
  "faster-whisper>=1.1.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "anyio>=4.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
