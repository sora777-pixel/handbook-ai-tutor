# LLM / embedding provider registry.
# Business code NEVER hardcodes model names or vendor SDKs — it only passes task="...".
# API keys are read from environment variables named in api_key_env. Never put secrets here.
#
# China-first defaults (DashScope / DeepSeek / SiliconFlow). Overseas vendors
# (OpenAI, Anthropic) honor HTTP_PROXY / HTTPS_PROXY from the process environment.
# Do not hardcode a proxy URL.
#
# ---------------------------------------------------------------------------
# WHICH PROVIDER GETS USED
# Resolved per task, first hit wins:
#   1. env LLM_TASK_ROUTES      (JSON map, e.g. {"tutor":"deepseek"})
#   2. env LLM_PROVIDER_TEXT    for summarize / extract_knowledge / quiz_generate /
#                               quiz_explain / tutor / notes_generate
#      env LLM_PROVIDER_AUDIO   for segment_summarize (video / speech)
#      env LLM_PROVIDER_EMBED   for embed
#      env LLM_PROVIDER_VISION  for transcribe_image (reading images / scanned PDFs)
#   3. env LLM_DEFAULT_PROVIDER
#   4. default_provider below
#   5. "mock"
#
# A provider participates in OCR only when it declares a `transcribe_image` model
# below. DeepSeek has no vision model, so it is intentionally absent there and a
# vision task will never be routed to it.
#
# `task_routes` below is intentionally EMPTY. Anything listed here overrides all
# env vars — which used to pin every task to mock and silently ignore API keys.
# Only add an entry when you want one task pinned to one vendor for good.
# ---------------------------------------------------------------------------

default_provider: mock

task_routes: {}

providers:
  mock:
    type: mock
    models:
      default: mock-llm
      embed: mock-embed

  dashscope:
    type: openai_compatible
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    models:
      default: qwen-plus
      summarize: qwen-plus
      extract_knowledge: qwen-plus
      quiz_generate: qwen-plus
      quiz_explain: qwen-plus
      notes_generate: qwen-plus
      tutor: qwen-plus
      segment_summarize: qwen-turbo
      embed: text-embedding-v3
      transcribe_image: qwen-vl-max

  deepseek:
    type: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    models:
      default: deepseek-chat
      tutor: deepseek-chat
      summarize: deepseek-chat
      extract_knowledge: deepseek-chat
      quiz_generate: deepseek-chat
      quiz_explain: deepseek-chat
      notes_generate: deepseek-chat
      segment_summarize: deepseek-chat

  siliconflow:
    type: openai_compatible
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    models:
      default: Qwen/Qwen2.5-7B-Instruct
      tutor: deepseek-ai/DeepSeek-V3
      summarize: Qwen/Qwen2.5-7B-Instruct
      extract_knowledge: Qwen/Qwen2.5-7B-Instruct
      quiz_generate: Qwen/Qwen2.5-7B-Instruct
      quiz_explain: Qwen/Qwen2.5-7B-Instruct
      notes_generate: Qwen/Qwen2.5-7B-Instruct
      segment_summarize: Qwen/Qwen2.5-7B-Instruct
      embed: BAAI/bge-m3
      # Verified against the live API on 2026-10-09: Qwen/Qwen2.5-VL-72B-Instruct
      # and Qwen/Qwen2.5-VL-32B-Instruct now answer HTTP 403 {"code":30003,
      # "message":"Model disabled."} — SiliconFlow retired them. Qwen3-VL works.
      # If this ever 403s again, the model was retired upstream: run a 1-token
      # probe against a candidate id and update this line (see 调研报告).
      transcribe_image: Qwen/Qwen3-VL-32B-Instruct

  openai:
    type: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    models:
      default: gpt-4o-mini
      embed: text-embedding-3-small
      transcribe_image: gpt-4o-mini

  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    models:
      default: claude-3-5-haiku-latest
      transcribe_image: claude-3-5-sonnet-latest

  ollama:
    type: ollama
    base_url: http://127.0.0.1:11434
    api_key_env: ""
    models:
      default: llama3.2
      embed: nomic-embed-text
      transcribe_image: llava

  openai_compat:
    type: openai_compatible
    base_url: https://api.deepseek.com
    api_key_env: OPENAI_COMPAT_API_KEY
    models:
      default: deepseek-chat
      # No embed model: DeepSeek (and this catch-all) must never post
      # deepseek-chat to /embeddings. Route embed to siliconflow / dashscope.
